<!DOCTYPE html>
<html>
<head>
    <title>ParkEase System</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'dashboard' %}">
            <i class="bi bi-car-front"></i> ParkEase
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <!-- DASHBOARD -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'dashboard' %}">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>

                <!-- VEHICLES DROPDOWN -->
                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-car-front"></i> Vehicles
                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item" href="{% url 'vehicle_category' %}">
                                Add Category
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'vehicle_category_list' %}">
                                Category List
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'register_vehicle' %}">
                                Register Vehicle
                            </a>
                        </li>

                        <li>
                            <a class="dropdown-item" href="{% url 'vehicle_registration_list' %}">
                                Vehicle List
                            </a>
                        </li>

                    </ul>
                </li>

                <!-- REPORTS DROPDOWN -->
                <li class="nav-item dropdown">

                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                        <i class="bi bi-file-earmark-text"></i> Reports
                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a class="dropdown-item" href="">
                                Generate Report
                            </a>
                        </li>

                    </ul>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
